name: Build Alt+H launcher preview

on:
  push:
    branches:
      - feature/alt-h-scrcpy-toggle
    paths:
      - scrcpy_audible_launcher.cs
      - .github/workflows/build-alt-h-preview.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile launcher with .NET Framework
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw 'csc.exe not found' }
          & $csc /nologo /target:winexe /platform:anycpu /optimize+ /win32icon:scrcpy_audible.ico /out:scrcpy_audible_launcher.exe scrcpy_audible_launcher.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save tested launcher on preview branch
        shell: bash
        run: |
          git add -- scrcpy_audible_launcher.exe
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'Build Alt+H launcher'
            git push origin HEAD:feature/alt-h-scrcpy-toggle
          fi
