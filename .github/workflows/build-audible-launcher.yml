name: Build scrcpy Audible launcher

on:
  push:
    branches:
      - review/scrcpy-local-20261002-084544
    paths:
      - scrcpy_audible_launcher.cs
      - .github/workflows/build-audible-launcher.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build Windows launcher
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (!(Test-Path $compiler)) { throw "C# compiler not found: $compiler" }
          & $compiler /nologo /target:winexe /platform:anycpu /optimize+ /out:scrcpy_audible_launcher.exe scrcpy_audible_launcher.cs
          if ($LASTEXITCODE -ne 0) { throw "C# build failed" }
      - name: Commit rebuilt launcher
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scrcpy_audible_launcher.exe
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Build launcher with Ctrl+Alt+S window placement"
          git push
